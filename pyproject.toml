[project]
name = "mari-usd-plugins"
description = "Mari USD CAPI plugins and Python integration modules"
version = "0.1.0"
readme = "README.txt"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [
    { name = "The Foundry Visionmongers" }
]
maintainers = [
    { name = "The Foundry Visionmongers" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

dependencies = [
    "build>=0.10.0",
    "coverage>=7.0",
    "flake8>=5.0",
    "flake8-docstrings",
    "flake8-import-order",
    "flake8-quotes",
    "PySide6>=6.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0",
    "twine>=4.0.0",
    "wheel>=0.38.0",
]

[project.urls]
Repository = "https://github.com/TheFoundryVisionmongers/mariusdplugins"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["python*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short"
]
testpaths = [
    "tests"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
