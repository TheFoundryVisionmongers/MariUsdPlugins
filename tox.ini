[tox]
envlist =
    style
skip_missing_interpreters = true
isolated_build = true

[testenv:style]
description = Run code style checks
deps =
    flake8>=5.0
    flake8-docstrings
    flake8-import-order
    flake8-quotes
skip_install = true
commands =
    flake8 python/
